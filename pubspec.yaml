name: getcontact
description: Ma'lumotlar qidiruvi — lokal SQLite bazasidan qidirish
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # SQLite
  sqflite: ^2.3.0

  # Fayl yo'llari (Android + iOS)
  path_provider: ^2.1.2
  path: ^1.8.3

  # Fayl tanlash (bazani import qilish uchun)
  file_picker: ^6.1.1

  # Ruxsatlar (Android)
  permission_handler: ^11.2.0

  # Parolni xavfsiz saqlash
  shared_preferences: ^2.2.2
  crypto: ^3.0.3

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - assets/

# ── APK / iOS ikonkasi ────────────────────────────────
# Yangilash: flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#05193F"
  adaptive_icon_foreground: "assets/icon.png"

# ── Yuklash ekrani (Loading...) ───────────────────────
# Yangilash: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#05193F"
  image: "assets/splash_logo.png"
  android: true
  ios: true
  android_12:
    color: "#05193F"
    image: "assets/splash_logo.png"
